name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  # --------------------------------------------------------------------------
  # Lint & test: runs once for the whole repo. Analyzes + runs the full test
  # suite on a single runner. Every platform build depends on this, so code
  # quality is validated (fail fast) before any platform-specific build spends
  # time on a runner.
  # --------------------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x' # Match the project SDK
          cache: true

      - run: flutter pub get
      - run: dart analyze
      - run: flutter test

  # --------------------------------------------------------------------------
  # Linux: build the GTK bundle, upload the tar.gz.
  # --------------------------------------------------------------------------
  build-linux:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package Linux bundle (tar.gz)
        # GNU tar returns 1 as a warning when a bundled file's mtime changes
        # mid-read (e.g. post-build artifacts); the archive is still complete,
        # so only fail on a genuine fatal error (exit 2+).
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "${GITHUB_WORKSPACE}/solutionscribe-linux-x64.tar.gz" . \
            || { rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; }
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: solutionscribe-linux-x64.tar.gz

  # --------------------------------------------------------------------------
  # macOS: build the .app, package it as a zip, upload the zip.
  # --------------------------------------------------------------------------
  build-macos:
    needs: [lint-and-test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS app (zip)
        run: |
          cd build/macos/Build/Products/Release
          zip -r -X "${GITHUB_WORKSPACE}/solutionscribe-macos.zip" SolutionsScribe.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: solutionscribe-macos.zip

  # --------------------------------------------------------------------------
  # Windows: build the .exe, zip the runner, upload the zip.
  # --------------------------------------------------------------------------
  build-windows:
    needs: [lint-and-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - run: flutter pub get

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Package Windows bundle (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath solutionscribe-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: solutionscribe-windows-x64.zip

  # --------------------------------------------------------------------------
  # Release: runs only on a v* tag. Waits for all three builds, downloads each
  # artifact zip, and publishes ONE release with all three files. A single
  # call to action-gh-release avoids the "already_exists" race that happens
  # when parallel jobs each try to create the same tag's release.
  # --------------------------------------------------------------------------
  release:
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64-bundle
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-bundle
          path: artifacts/windows

      # Glob all three archives from their per-platform dirs and attach them to
      # a single release for the tag that triggered this run.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/solutionscribe-linux-x64.tar.gz
            artifacts/windows/solutionscribe-windows-x64.zip
            artifacts/macos/solutionscribe-macos.zip